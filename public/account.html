<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Tài khoản | ShopMMO</title>
<link rel="stylesheet" href="/store.css">
</head>
<body>
<a class="skip" href="#main">Đến nội dung chính</a>
<header class="site-header"><div class="wrap bar"><a class="brand" href="/">ShopMMO</a><nav class="nav" aria-label="Điều hướng chính"><a href="/#san-pham">Sản phẩm</a><a href="/orders">Đơn hàng</a><a href="/account" aria-current="page">Tài khoản</a></nav></div></header>
<main class="wrap account-wrap" id="main">
  <section class="intro"><h1>Tài khoản</h1><p class="muted">Đăng nhập để xem đơn trên các thiết bị của bạn.</p></section>
  <p id="account-load" class="muted" role="status">Đang kiểm tra phiên đăng nhập…</p>
  <section class="panel account-panel" id="auth-panel" aria-labelledby="auth-title" hidden>
    <h2 class="sr-only" id="auth-title">Đăng nhập</h2>
    <div class="account-mode"><button type="button" id="login-mode" aria-pressed="true">Đăng nhập</button><button type="button" id="register-mode" aria-pressed="false">Đăng ký</button></div>
    <form id="auth-form">
      <label for="email">Email</label><input id="email" name="email" type="email" autocomplete="username" maxlength="254" spellcheck="false" required>
      <label for="password">Mật khẩu</label><input id="password" name="password" type="password" autocomplete="current-password" minlength="12" maxlength="128" aria-describedby="password-hint" required>
      <p class="muted postnote" id="password-hint" hidden>Dùng ít nhất 12 ký tự.</p>
      <button class="button primary" id="auth-submit" type="submit">Đăng nhập</button>
    </form>
  </section>
  <section class="panel account-panel" id="profile-panel" aria-labelledby="profile-title" hidden>
    <h2 id="profile-title">Đã đăng nhập</h2><p id="profile-email" translate="no"></p>
    <div class="actions"><a class="button primary" href="/orders">Xem đơn hàng</a><button class="button secondary" id="logout" type="button">Đăng xuất</button></div>
  </section>
  <p id="account-status" class="status-msg" role="status"></p>
</main>
<script src="/account.js" defer></script>
</body>
</html>

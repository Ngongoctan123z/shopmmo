<!doctype html>
<html lang="vi"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản trị | ShopMMO</title>
<link rel="stylesheet" href="/admin.css">
<header><div><h1>Quản trị ShopMMO</h1><a href="/">Về cửa hàng</a></div></header>
<main>
<section><form id="login"><label>Mã quản trị<input id="token" type="password" autocomplete="off" required></label><button>Mở quản trị</button></form><button id="logout" hidden>Đăng xuất</button><p id="status" role="status"></p></section>
<div id="dashboard" hidden>
<section><h2>Kết nối API</h2><div id="sources" class="panel"></div></section>
<section><h2>Duyệt và quản lý gói</h2>
<div class="tools"><label>Tìm theo tên hoặc mã<input type="search" id="query"></label><label>Nguồn<select id="supplier"><option value="">Tất cả</option><option value="uniz">Uniz</option><option value="melody">MelodyApp</option></select></label><label>Trạng thái<select id="statusFilter"><option value="">Tất cả</option><option value="pending">Chờ duyệt</option><option value="live">Đang hiển thị</option><option value="blocked">Bị chặn</option><option value="stock">Hết hàng</option></select></label></div>
<div class="scroll"><table><thead><tr><th>Gói / SKU</th><th>Tồn và giao hàng</th><th>Thương hiệu / Giá bán</th><th>Đăng bán</th></tr></thead><tbody id="products"></tbody></table></div>
<div class="row"><button id="prev" type="button">Trang trước</button><span id="page"></span><button id="next" type="button">Trang sau</button></div>
</section>
<section><h2>Đơn hàng ShopMMO</h2><p id="payment-config"></p><div class="scroll"><table><thead><tr><th>Mã đơn / Gói</th><th>Tiền</th><th>Trạng thái / Đối soát</th></tr></thead><tbody id="orders"></tbody></table></div></section><section><h2>Nhật ký thao tác</h2><ul id="events"></ul></section>
</div>
</main><script src="/admin.js" defer></script></html>
